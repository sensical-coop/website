    <path d="M0,80 H1960"/>
    <path d="M1940,68 L1962,80 L1940,92"/>
    <g>
      <path d="M300,80 V30"/><path d="M300,30 h70 l-14,12 l14,12 h-70"/>
      <path d="M760,80 V24"/><path d="M760,24 h70 l-14,12 l14,12 h-70"/>
