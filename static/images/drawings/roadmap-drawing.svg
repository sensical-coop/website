  <g stroke="#000" stroke-width="3">
    <circle cx="300" cy="80" r="13" fill="#000"/>
    <circle cx="760" cy="80" r="13" fill="#000"/>
    <circle cx="1220" cy="80" r="16" fill="#e2c166"/>
    <circle cx="1680" cy="80" r="13" fill="#fff"/>
