<div id="main-menu-mobile" class="main-menu-mobile">
  <ul class="container">
    {{ $currentPage := . }}
    {{ range .Site.Menus.main }}
    <li class="menu-item-{{ .Name | lower }}{{ if $currentPage.IsMenuCurrent "main" . }} active{{ end }}">
      <a href="{{.URL}}">
        {{ .Pre }}
        <span>{{ .Name }}</span>
      </a>
    </li>
    {{end}}
  </ul>

  <ul class="container">
    {{ range .AllTranslations }}
    <li>
      <a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}">{{ .Language.Label | lower }}</a>
    </li>
    {{ end }}
  </ul>
</div>
