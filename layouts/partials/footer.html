<div class="footer">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="footer-inner">
          {{ if .Site.Data.social }}
          <ul class="social">
              {{ range .Site.Data.social }}
                  <li><a href="{{ .link }}" target="blank"><img width="20" height="20" src="{{ .image | relURL }}" title="{{ .name }}" alt="{{ .name }}" /></a></li>
              {{ end }}
          </ul>
          {{ end }}
          <ul class="footer-menu">
            <li>
              <a class="footer-link" href="{{ .Site.LanguagePrefix }}/">{{ T "Home" }}</a>
            </li>
            <li>{{ with .Site.GetPage "/contact/" }}
              <!-- The permalink below needs to work in this way, otherwise it duplicates the slug on the page -->
              <a class="footer-link" href="{{ .Site.LanguagePrefix }}/{{ .Params.url }}">{{ .Params.button | T "Contact"}}</a>{{ end }}</li>
            <li class="copyright">© {{ now.Format "2006" }} {{ .Site.Title }}</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
