<footer class="footer">
  <div class="container px-2 px-lg-0">
    <div class="footer-inner">
      <div class="footer-brand">
        <a class="footer-logo" href="{{ site.Home.RelPermalink }}">{{ site.Params.logo.text }}</a>
        <p class="footer-legal">© {{ now.Format "2006" }} {{ site.Title }} · Barcelona</p>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <ul class="footer-menu">
          {{ range site.Menus.main }}
          <li><a class="footer-link" href="{{ .URL }}">{{ .Name }}</a></li>
          {{ end }}
          {{ with site.GetPage "/pages/faq" }}
          <li><a class="footer-link" href="{{ .RelPermalink }}">{{ T "FAQ" }}</a></li>
          {{ end }}
        </ul>
        {{ with hugo.Data.social }}
        <ul class="social">
          {{ range . }}
          <li><a href="{{ .link }}" target="_blank" rel="noopener me"><img width="20" height="20" src="{{ .image | relURL }}" title="{{ .name }}" alt="{{ .name }}" /></a></li>
          {{ end }}
        </ul>
        {{ end }}
      </nav>
    </div>
  </div>
</footer>
