<div class="container-item language-select">
  <button type="button" class="lang-toggle dropdown-toggle" aria-haspopup="true" aria-expanded="false" aria-label="{{ T "Language" }}: {{ .Language.Label }}">
    {{ .Language.Label }}
  </button>
  <div class="dropdown-menu">
    {{ range .AllTranslations }}
    <a class="dropdown-item{{ if eq .Language.Lang $.Language.Lang }} active{{ end }}" href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}">{{ .Language.Label }}</a>
    {{ end }}
  </div>
</div>
