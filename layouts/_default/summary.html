<article class="work-card">
  <div class="work-card__meta" aria-hidden="true"></div>
  <h3 class="work-card__title">{{ .Title }}</h3>
  {{ with .Params.labels }}
  <ul class="work-card__labels">
    {{ range . }}<li>{{ . }}</li>{{ end }}
  </ul>
  {{ end }}
  {{ $text := .Content | plainify }}
  {{ $first := index (split $text ".") 0 }}
  <p class="work-card__text">{{ $first | plainify }}.</p>
  <a class="sensical-button sensical-button-plus stretched-link" href="{{ .RelPermalink }}">
    <span class="circle-button" aria-hidden="true"><span class="plus">+</span></span>
    <span class="button-link-text fs-5">{{ T "Read more" }}<span class="visually-hidden">: {{ .Title }}</span></span>
  </a>
</article>
