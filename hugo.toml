baseURL = "https://sensical.es/"
locale = "en"
title = "Sensical SCCL"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[module]
  [module.hugoVersion]
    extended = true
    min = "0.158.0"

[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

# Per-page Markdown twins for LLMs (GEO): /services/co-creation/ -> /services/co-creation.md
[outputFormats]
  [outputFormats.markdown]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    ugly = true
    notAlternative = true

[outputs]
  home = ["html"]
  section = ["html"]
  page = ["html", "markdown"]

[params]
  google_analytics_id=""
  # Default social sharing image (absolute URL is built in the head partial)
  og_image = "images/og/sensical-2400x1260.png"

  [params.logo]
    favicon = "images/logo/favicon.ico"
    text = "snscl"
    alt = "Sensical SCCL"

[permalinks]
  [permalinks.page]
    pages = "/:slugorcontentbasename/"
    services = "/services/:contentbasename/"
    projects = "/projects/:contentbasename/"

DefaultContentLanguage = "en"
[languages]
  [languages.en]
    contentDir = 'content/en'
    label = 'en'
    locale = 'en'
    weight = 10
    [languages.en.menus]
      [[languages.en.menus.main]]
        name = 'Services'
        pageRef = '/services'
        weight = 10
      [[languages.en.menus.main]]
        name = 'Projects'
        pageRef = '/projects'
        weight = 15
      [[languages.en.menus.main]]
        name = 'About'
        pageRef = '/pages/about'
        weight = 20
      [[languages.en.menus.main]]
        name = 'Contact'
        pageRef = '/pages/contact'
        weight = 30
